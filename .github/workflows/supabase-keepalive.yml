name: Supabase keep-alive

# Supabase free projects pause after ~7 days of inactivity. This pings the DB on a
# schedule so the project never sleeps — no more manual "restore project". Uses the
# same public-safe secrets as deploy.yml (anon keys are meant to live in client
# code), falling back to the committed defaults so it works with zero setup.

on:
  schedule:
    - cron: '17 6 */3 * *'   # every ~3 days at 06:17 UTC (well under the 7-day pause window)
  workflow_dispatch: {}       # + a manual "Run workflow" button in the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase to keep the project awake
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://lfemwowmirdiqiorcufn.supabase.co' }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'sb_publishable_vCoBDV7rtjl6Ka5IHIvdTA_ryywqSgt' }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            "$SUPABASE_URL/rest/v1/profiles?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "Supabase responded: HTTP $code"
          # Any answer below 500 means the project is awake and served the request
          # (200/206 = rows, 401/403 = RLS blocked but the DB still ran) — that's all
          # we need to reset the idle timer. Only a 5xx / no-response is a real failure.
          if [ "$code" -ge 500 ] || [ "$code" = "000" ]; then
            echo "::error::Supabase keep-alive failed (HTTP $code)"
            exit 1
          fi
          echo "✅ project is awake"
